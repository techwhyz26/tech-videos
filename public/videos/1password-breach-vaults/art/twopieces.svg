<defs>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a56"/><stop offset="1" stop-color="#1e1e25"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f8"/><stop offset="1" stop-color="#b9b9c6"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b24"/><stop offset="1" stop-color="#050507"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e5da"/></linearGradient>
</defs><defs><clipPath id="kl"><rect x="-200" y="-200" width="330" height="400"/></clipPath>
<clipPath id="kr"><rect x="130" y="-200" width="600" height="400"/></clipPath></defs>
<g transform="translate(180 420)">
  <g><animateTransform attributeName="transform" type="translate" values="-140 0;-140 0;0 0" keyTimes="0;0.3;1" dur="1.4s" fill="freeze"/>
    <g clip-path="url(#kl)"><rect x="60" y="-26" width="560" height="52" rx="12" class="fa"/><rect x="468" y="10" width="76" height="70" rx="6" class="fa"/><rect x="380" y="10" width="76" height="40" rx="6" class="fa"/><rect x="292" y="10" width="76" height="80" rx="6" class="fa"/><rect x="204" y="10" width="76" height="50" rx="6" class="fa"/><rect x="116" y="10" width="76" height="64" rx="6" class="fa"/><rect x="70" y="-22" width="540" height="12" rx="6" fill="#fff" opacity="0.3"/><circle r="96" class="fa"/><circle r="38" class="fb"/><path d="M-70 -40 a80 80 0 0 1 60 -44" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.4"/></g></g>
  <g><animateTransform attributeName="transform" type="translate" values="160 0;160 0;0 0" keyTimes="0;0.3;1" dur="1.4s" fill="freeze"/>
    <g clip-path="url(#kr)"><rect x="60" y="-26" width="560" height="52" rx="12" class="fa2"/><rect x="468" y="10" width="76" height="70" rx="6" class="fa2"/><rect x="380" y="10" width="76" height="40" rx="6" class="fa2"/><rect x="292" y="10" width="76" height="80" rx="6" class="fa2"/><rect x="204" y="10" width="76" height="50" rx="6" class="fa2"/><rect x="116" y="10" width="76" height="64" rx="6" class="fa2"/><rect x="70" y="-22" width="540" height="12" rx="6" fill="#fff" opacity="0.3"/><circle r="96" class="fa2"/><circle r="38" class="fb"/><path d="M-70 -40 a80 80 0 0 1 60 -44" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.4"/></g></g>
</g>
<circle cx="310" cy="420" r="30" fill="#fff" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;0" begin="1.4s" dur="0.6s" fill="freeze"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.35s" fill="freeze"/><text x="200" y="640" font-size="46" text-anchor="middle" class="fa">Account password</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.35s" fill="freeze"/><text x="620" y="640" font-size="46" text-anchor="middle" class="fa2">Secret Key</text></g>
<g transform="translate(500 860)"><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.2s" fill="freeze"/><animateTransform attributeName="transform" type="scale" values="0.3;1.15;1" keyTimes="0;0.7;1" begin="1.8s" dur="0.45s" fill="freeze"/><rect x="-261.0" y="-48" width="522" height="96" rx="20" class="fa"/><text x="0" y="16" font-size="46" font-weight="700" text-anchor="middle" style="fill:#0a0a0a">1 + 1 = YOUR KEY</text></g></g>