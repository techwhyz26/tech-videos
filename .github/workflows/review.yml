# Every two hours: read your Approve / Reject taps in Telegram and post the approved videos.
name: Post approved videos

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours, at 17 minutes past
    - cron: "3 22,23 * * *"  # just after the 6 pm New York posting slot (summer and winter time)
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional: post this video (folder name) without a Telegram tap"
        type: string
        default: ""
      now:
        description: "Post it straight away instead of at the next best time"
        type: boolean
        default: false
      only:
        description: "Optional: only these platforms, e.g. youtube (to retry one that failed)"
        type: string
        default: ""

permissions:
  contents: write   # record which videos were posted

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_API_KEY_2: ${{ secrets.UPLOAD_POST_API_KEY_2 }}
      UPLOAD_POST_API_KEY_3: ${{ secrets.UPLOAD_POST_API_KEY_3 }}
      UPLOAD_POST_API_KEY_4: ${{ secrets.UPLOAD_POST_API_KEY_4 }}
      UPLOAD_POST_API_KEY_5: ${{ secrets.UPLOAD_POST_API_KEY_5 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Post the video named by hand
        if: inputs.slug != ''
        env:
          SLUG: ${{ inputs.slug }}
          NOW: ${{ inputs.now && '--now' || '' }}
          ONLY: ${{ inputs.only }}
        run: python run.py post "$SLUG" $NOW ${ONLY:+--only "$ONLY"}

      - name: Act on Telegram taps
        run: python run.py review

      - name: Record what was posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if ! git diff --cached --quiet; then
            git commit -m "Review results"
            git pull --rebase
            git push
          fi
