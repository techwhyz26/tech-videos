# Makes one video a day in the cloud and sends it to Telegram for you to approve.
# Run it by hand: GitHub -> Actions -> "Make a video" -> Run workflow.
name: Make a video

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC. Change the hour to taste (times are UTC).
  workflow_dispatch:
    inputs:
      kind:
        description: "What to make"
        type: choice
        options: [alternate, news, explainer]
        default: alternate
      idea:
        description: "Optional: your own idea, e.g. How does Bluetooth work?"
        type: string
        required: false

permissions:
  contents: write   # commit the script and drawings, create the release that holds the video

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt

      - name: Write, voice and render the video
        env:
          KIND: ${{ inputs.kind || 'alternate' }}
          IDEA: ${{ inputs.idea }}
        run: |
          python run.py auto --kind "$KIND" --no-review ${IDEA:+--idea "$IDEA"}
          echo "SLUG=$(python -c "import json; print(json.load(open('output/last.json'))['slug'])")" >> "$GITHUB_ENV"

      - name: Save the script and drawings to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/videos data
          git commit -m "New video: $SLUG"
          git pull --rebase
          git push

      - name: Store the video as a release
        run: gh release create "video-$SLUG" "output/$SLUG.mp4" "output/$SLUG.txt" --title "$SLUG" --notes-file "output/$SLUG.txt"

      - name: Send it to Telegram for review
        run: python run.py send-review "$SLUG"

      - name: Tell me if something went wrong
        if: failure()
        run: python run.py notify "Today's video failed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
