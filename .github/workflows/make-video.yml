# Makes one video a day in the cloud with Claude Code (logged in with your Claude subscription) and
# sends it to Telegram for you to approve. Run it by hand: Actions -> "Make a video" -> Run workflow.
name: Make a video

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC. Change the hour to taste (times are UTC).
  workflow_dispatch:
    inputs:
      kind:
        description: "What to make"
        type: choice
        options: [alternate, news, explainer]
        default: alternate
      idea:
        description: "Optional - your own idea, for example How does Bluetooth work?"
        type: string
        required: false
      engine:
        description: "Which AI makes it (auto = Claude first, Gemini if Claude fails)"
        type: choice
        options: [auto, claude, gemini]
        default: auto

permissions:
  contents: write   # commit the script and drawings, create the release that holds the video

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          pip install -r requirements.txt
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @google/gemini-cli

      - name: Decide what to make
        env:
          KIND: ${{ inputs.kind || 'alternate' }}
          IDEA: ${{ inputs.idea }}
        run: |
          if [ -n "$IDEA" ]; then
            TASK="Make an explainer video about this idea from the channel owner: $IDEA"
          else
            if [ "$KIND" = "alternate" ]; then
              if [ $(( $(date +%s) / 86400 % 2 )) -eq 0 ]; then KIND=news; else KIND=explainer; fi
            fi
            if [ "$KIND" = "news" ]; then
              TASK="Make a tech-update video about the biggest tech or gaming story people are talking about right now."
            else
              TASK="Make a video about the surprising technology behind something trending this week."
            fi
          fi
          echo "TASK=$TASK" >> "$GITHUB_ENV"
          echo "$TASK"

      - name: Claude Code makes the video
        id: claude
        if: ${{ (inputs.engine || 'auto') != 'gemini' }}
        continue-on-error: ${{ (inputs.engine || 'auto') == 'auto' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$TASK Follow the section 'Making one video' in CLAUDE.md exactly, including checking the frames. The standard in CLAUDE.md is non-negotiable. Finish by writing output/last.json." \
            --model opus \
            --max-turns 200 \
            --permission-mode default \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python run.py *),Bash(python tools/*)" \
            --output-format text
          test -f output/last.json || { echo "Claude did not finish the video (no output/last.json)"; exit 1; }

      # Backup: Google's Gemini CLI follows the same CLAUDE.md when Claude is not available (for example
      # when the Claude subscription has ended). Needs the GEMINI_API_KEY secret (free from Google AI Studio).
      - name: Gemini makes the video (backup)
        if: ${{ (inputs.engine || 'auto') == 'gemini' || ((inputs.engine || 'auto') == 'auto' && steps.claude.outcome == 'failure') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The AI gets no access to the GitHub, Telegram or posting keys.
          GH_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Claude failed and there is no GEMINI_API_KEY secret for the backup."; exit 1; }
          # Start clean: drop anything a failed Claude run left behind.
          git checkout -- . && git clean -fdq -- public/videos tools data
          rm -f output/last.json
          gemini --yolo -p "You are making one short video for the TechWhyz channel in this repository. \
          First read CLAUDE.md completely, then read tools/art_qr.py, tools/art_microwave.py, tools/artlib.py and \
          public/videos/microwave-wifi/spec.json. $TASK Follow the section 'Making one video' in CLAUDE.md exactly, \
          step by step: choose a trending subject with web search, write tools/art_<slug>.py and run it, write the \
          spec.json, run 'python run.py build <slug>', then 'python run.py frames <slug>' and look at the contact sheet \
          image, fixing the art at most twice. The visual standard in CLAUDE.md is non-negotiable. Do not commit, push \
          or send anything. Finish by writing output/last.json."
          test -f output/last.json || { echo "Gemini did not finish the video (no output/last.json)"; exit 1; }

      - name: Which video was made
        run: |
          test -f output/last.json || { echo "No video was made."; exit 1; }
          echo "SLUG=$(python -c "import json; print(json.load(open('output/last.json'))['slug'])")" >> "$GITHUB_ENV"

      - name: Save the script and drawings to the repository
        run: |
          test -f "output/$SLUG.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all -- public/videos tools
          if [ -e data/used.json ]; then git add data/used.json; fi
          git commit -m "New video: $SLUG"
          git pull --rebase
          git push

      - name: Store the video as a release
        run: gh release create "video-$SLUG" "output/$SLUG.mp4" "output/$SLUG.txt" --title "$SLUG" --notes-file "output/$SLUG.txt"

      - name: Send it to Telegram for review
        run: python run.py send-review "$SLUG"

      - name: Keep the finished work if a later step failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-video
          path: |
            output/*.mp4
            output/*.txt
            output/last.json
            public/videos
            tools
          if-no-files-found: ignore
          retention-days: 7

      - name: Tell me if something went wrong
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python run.py notify "Today's video failed. Details: $RUN_URL"
