# Weekly: swap the Instagram token for a fresh 60-day one, so it never expires.
# Needs a GH_PAT secret: a fine-grained GitHub token for this repository with "Secrets: Read and write".
name: Refresh Instagram token

on:
  schedule:
    - cron: "40 6 * * 1"   # Mondays 06:40 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh and save the token
        run: |
          python -c "from pipeline import instagram; print(instagram.refresh())" > new_token.txt
          echo "::add-mask::$(cat new_token.txt)"
          gh secret set INSTAGRAM_TOKEN -R "$GITHUB_REPOSITORY" < new_token.txt
          rm new_token.txt
          echo "Instagram token refreshed for another 60 days."
      - name: Tell Telegram if it failed
        if: failure()
        run: python run.py notify "Instagram token refresh failed. Posting to Instagram will stop when the token expires. Details - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
