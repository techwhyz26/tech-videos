# Manual: finds your Telegram chat id (send your bot a message first) and sends you a test message.
name: Check Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx
      - name: Find the chat id and say hello
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, ".")
          from pipeline import notify
          chats = notify.find_chat_id()
          if not chats:
              sys.exit("No messages found. Open your bot in Telegram, press Start, send it 'hi', then run this again.")
          for chat_id, name in chats:
              print(f"TELEGRAM_CHAT_ID = {chat_id}   ({name})")
          os.environ["TELEGRAM_CHAT_ID"] = chats[0][0]
          notify.send_message("TechWhyz Studio is connected. New videos will arrive here for your approval.")
          print("Test message sent.")
          EOF
